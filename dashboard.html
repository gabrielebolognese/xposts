<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Threads</title>
<style>
  :root { --bg: #fff; --ink: #000; --muted: #666; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #fff; --muted: #999; --line: #333; } }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 760px; padding: 24px 16px 60px; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 0; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  nav { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 18px 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: 0; padding: 2px 0; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; }
  nav button.on { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
  article { border-bottom: 1px solid var(--line); padding: 18px 0; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .rate { font-size: 12px; font-weight: 700; color: #fff; border-radius: 4px; padding: 1px 7px; }
  .r1 { background: #0a7d3b; } .r2 { background: #1f5fbf; } .r3 { background: #a35c00; } .r4 { background: #c0143c; }
  .bar { display: flex; gap: 3px; margin: 10px 0 2px; }
  .bar i { flex: 1; height: 3px; background: var(--line); }
  .bar i.done { background: var(--ink); }
  .thread { list-style: none; margin: 12px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  .thread li { margin-bottom: 12px; }
  .who { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .who .over { color: var(--ink); font-weight: 700; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 1px 0 0; }
  .note { font-size: 14px; color: var(--muted); margin: 8px 0 0; overflow-wrap: anywhere; }
  details { font-size: 14px; margin-top: 6px; }
  summary { cursor: pointer; color: var(--muted); }
  dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; margin: 6px 0 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .actions span { flex: 1 1 240px; font-size: 14px; }
  button.main { background: var(--ink); color: var(--bg); border: 1px solid var(--ink); border-radius: 4px; padding: 6px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.alt { background: none; color: var(--ink); border: 1px solid var(--ink); border-radius: 4px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .box { margin-top: 24px; }
  pre { font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); max-height: 360px; overflow: auto; }
  .run { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 4px 0; }
  .run a { color: var(--ink); }
  .empty { color: var(--muted); padding: 30px 0; }
</style>
</head>
<body>
<h1>Auto threads</h1>
<div class="sub" id="status">Connecting</div>
<nav id="tabs"></nav>
<div id="list"></div>
<details class="box"><summary>Posted now</summary><div id="nowRuns" class="note"></div></details>
<details class="box" id="logBox"><summary>Runner log</summary><pre id="log"></pre></details>
<script>
const TABS = [['all', 'All'], ['making', 'Making'], ['scheduled', 'Scheduled'], ['waiting', 'Waiting'],
              ['review', 'Review'], ['dropped', 'Dropped'], ['posted', 'Posted']];
const STAGES = ['analyze', 'score', 'hooks', 'thread', 'inspect', 'virality'];
const STAGE_LABEL = { analyze: 'verifying the project', score: 'scoring the discovery', hooks: 'writing hooks',
                      thread: 'writing the thread', inspect: 'quality control', virality: 'virality scoring' };
let data = null, online = false, tab = 'all', confirming = null;
const open = new Set(), notes = {};
try { tab = localStorage.getItem('tab') || 'all'; } catch {}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const group = (t) => (t.status === 'posted-now' ? 'posted' : t.status === 'lost' ? 'dropped' : t.status);
function when(slot) {
  const m = /^(\d{4}-\d{2}-\d{2})_(\d{2})(\d{2})/.exec(slot || '');
  if (!m) return slot ? new Date(slot).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  return `${new Date(`${m[1]}T12:00:00Z`).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })}, ${m[2]}:${m[3]}`;
}
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
}
const rate = (t) => t.score == null ? ''
  : `<span class="rate ${t.score >= 80 ? 'r1' : t.score >= 70 ? 'r2' : t.score >= 60 ? 'r3' : 'r4'}" title="hook ${t.hookScore}, thread ${t.threadScore}">${t.score} ${esc(t.classification)}</span>`;

function statusText(t) {
  switch (t.status) {
    case 'making': return `Making: ${STAGE_LABEL[t.stage] || t.stage}${t.stage === 'inspect' && t.fixRound ? `, fix round ${t.fixRound}` : ''}`;
    case 'scheduled': return `Scheduled ${when(t.slot)}`;
    case 'waiting': return 'Waiting in the virality queue';
    case 'posted': return `Posted${t.postedAt ? ' ' + when(t.postedAt) : ''}`;
    case 'posted-now': return `Posted now${t.postedAt ? ', ' + when(t.postedAt) : ''}`;
    case 'review': return 'Needs review';
    case 'dropped': return 'Dropped';
    default: return t.status;
  }
}

function actions(t) {
  if (notes[t.run]) return `<p class="note">${esc(notes[t.run])}</p>`;
  if (!t.parts || t.status === 'posted' || t.status === 'posted-now') return '';
  if (confirming === t.run) {
    const risk = ['making', 'review', 'dropped'].includes(t.status) ? ' It has not passed every check yet.' : '';
    const slot = t.status === 'scheduled' ? ` Its slot goes to the next best thread.` : '';
    return `<div class="actions"><span>Post this thread on X now?${risk} Nothing else in the schedule changes.${slot}</span>
      <button class="main" data-act="post" data-run="${esc(t.run)}"${online ? '' : ' disabled'}>Yes, post it now</button>
      <button class="alt" data-act="cancel">Cancel</button></div>`;
  }
  return `<div class="actions"><button class="main" data-act="ask" data-run="${esc(t.run)}"${online ? '' : ' disabled title="The dashboard server is not running"'}>Post thread now</button></div>`;
}

function card(t) {
  const at = STAGES.indexOf(t.stage);
  const bar = t.status === 'making' ? `<div class="bar">${STAGES.map((s, i) => `<i class="${i < at ? 'done' : ''}" title="${s}"></i>`).join('')}</div>` : '';
  let body;
  if (t.parts) {
    body = `<ol class="thread">${t.parts.map((p, i) => {
      const n = [...p].length;
      return `<li><div class="who"><span>${i === 0 ? 'Main post' : `Reply ${i}`}</span><span class="${n > 280 ? 'over' : ''}">${n}/280</span></div><p class="text">${esc(p)}</p></li>`;
    }).join('')}</ol>`;
  } else if (t.hook) {
    body = `<ol class="thread"><li><div class="who"><span>Hook</span></div><p class="text">${esc(t.hook)}</p></li></ol><p class="note">The replies are being written.</p>`;
  } else {
    body = `<p class="note">${t.status === 'making' ? 'Verifying and scoring the project. The thread appears here as soon as it is written.' : 'No thread was written.'}</p>`;
  }
  const reason = (t.status === 'dropped' || t.status === 'review') && t.outcome ? `<p class="note">${esc(t.outcome.replace(/^dropped:\s*/, ''))}</p>` : '';
  const rows = [['Problem', t.problem], ['Repository', t.repo], ['Pricing', t.pricing], ['License', t.license],
    ['Virality', t.score != null ? `${t.score} (hook ${t.hookScore}, thread ${t.threadScore})` : ''],
    ['Strengths', t.strengths], ['Weaknesses', t.weaknesses], ['Run', t.run]].filter((r) => r[1]);
  return `<article>
    <div class="meta"><b>${esc(statusText(t))}</b><span>updated ${ago(t.updated)}</span>${rate(t)}</div>
    <h2>${esc(t.name)}</h2><div class="sub">${esc(t.category)}</div>
    ${bar}${body}${reason}
    <details data-run="${esc(t.run)}"${open.has(t.run) ? ' open' : ''}><summary>Details</summary>
      <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details>
    ${actions(t)}</article>`;
}

function render() {
  if (!data) return;
  const count = (k) => (k === 'all' ? data.threads.length : data.threads.filter((t) => group(t) === k).length);
  document.getElementById('tabs').innerHTML = TABS.map(([k, label]) =>
    `<button class="${k === tab ? 'on' : ''}" data-tab="${k}">${label} ${count(k)}</button>`).join('');
  let list = data.threads.filter((t) => tab === 'all' || group(t) === tab);
  if (tab === 'scheduled') list = [...list].sort((a, b) => a.slot.localeCompare(b.slot));
  if (tab === 'waiting') list = [...list].sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
  document.getElementById('list').innerHTML = list.length ? list.map(card).join('')
    : `<p class="empty">${data.threads.length ? 'Nothing here right now.' : 'No threads yet. They appear here as soon as the runner starts making them (bash pipeline/run.sh).'}</p>`;
  const log = document.getElementById('log');
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = data.log.lines.join('\n') || 'The runner has not written anything yet.';
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function status(text) { document.getElementById('status').textContent = text; }

async function refresh() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    online = true;
    const recent = data.log.updated && Date.now() - data.log.updated < 40 * 60000;
    const runner = data.lock && recent ? `runner on, last activity ${ago(data.log.updated)}`
      : `runner ${data.lock ? 'quiet' : 'off'}${data.log.updated ? `, last activity ${ago(data.log.updated)}` : ''}`;
    status(`Live, updated ${new Date().toLocaleTimeString('en-GB')}. Today: ${data.madeToday} threads made, ${data.searches} category searches. ${runner[0].toUpperCase() + runner.slice(1)}.`);
  } catch {
    online = false;
    status('Offline: the dashboard server is not running. Start it with npm run dashboard, then reload this page.');
  }
  render();
}

async function refreshRuns() {
  const box = document.getElementById('nowRuns');
  try {
    const r = await (await fetch('/api/post-now-runs', { cache: 'no-store' })).json();
    if (r.error) { box.textContent = r.error; return; }
    box.innerHTML = r.data.length ? r.data.map((x) => {
      const state = x.status === 'completed' ? (x.conclusion === 'success' ? 'posted' : x.conclusion) : x.status.replace('_', ' ');
      const at = new Date(x.createdAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      return `<div class="run"><span>${esc(at)}  ${esc(x.displayTitle.replace(/^post now /, ''))}</span><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(state)}</a></div>`;
    }).join('') : 'Nothing posted from here yet.';
  } catch {
    box.textContent = 'Could not reach the dashboard server.';
  }
}

async function postNow(run) {
  let r;
  try {
    r = await fetch('/api/post-now', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ run }) });
  } catch {
    return 'Not sent: the dashboard server is not running. Start it with npm run dashboard, then reload this page.';
  }
  let body = {};
  try { body = await r.json(); } catch {}
  if (!r.ok || body.error) return `Not sent: ${body.error || `the server answered ${r.status}`}`;
  return 'Sent. GitHub posts it within a minute or two, the replies follow 10 to 40 seconds apart.';
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  tab = b.dataset.tab;
  try { localStorage.setItem('tab', tab); } catch {}
  render();
});
document.getElementById('list').addEventListener('toggle', (e) => {
  if (e.target.tagName === 'DETAILS') e.target.open ? open.add(e.target.dataset.run) : open.delete(e.target.dataset.run);
}, true);
document.getElementById('list').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const run = b.dataset.run;
  if (b.dataset.act === 'ask') confirming = run;
  if (b.dataset.act === 'cancel') confirming = null;
  if (b.dataset.act === 'post') {
    confirming = null;
    notes[run] = 'Sending to GitHub...';
    render();
    notes[run] = await postNow(run);
    if (notes[run].startsWith('Not sent')) setTimeout(() => { delete notes[run]; render(); }, 10000);
    refresh();
    setTimeout(refreshRuns, 4000);
  }
  render();
});

refresh();
refreshRuns();
setInterval(refresh, 4000);
setInterval(refreshRuns, 15000);
</script>
</body>
</html>
