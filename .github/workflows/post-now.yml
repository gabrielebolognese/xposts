name: post-now
run-name: post now ${{ inputs.run }}

# Started by the dashboard's "Post thread now" button: posts one thread immediately, outside the schedule.
on:
  workflow_dispatch:
    inputs:
      run:
        description: 'The runner folder the thread comes from (for the record)'
        required: true
      thread:
        description: 'The thread parts as base64 JSON (main post first)'
        required: true
      slot:
        description: 'The queue folder that held this thread, removed once it went out (empty when it had no slot)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Post the thread now
        run: node post-now.js
        env:
          X_APP_KEY: ${{ secrets.X_APP_KEY }}
          X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREAD: ${{ inputs.thread }}
          RUN: ${{ inputs.run }}

      # always(): once the main post is out, the scheduled copy must go even if a reply failed
      - name: Take it out of the schedule
        if: always()
        env:
          SLOT: ${{ inputs.slot }}
        run: |
          [ -f post-now.json ] || exit 0
          [[ "$SLOT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}$ ]] || exit 0
          [ -d "queue/$SLOT" ] || exit 0
          git config user.name "x-autopost"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "queue/$SLOT"
          git commit -m "post now: $SLOT went out early"
          git pull --rebase
          git push
