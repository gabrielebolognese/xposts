<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build in public</title>
<style>
  :root { --bg: #fff; --fg: #000; --muted: #666; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #fff; --muted: #999; --line: #333; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 24px; }
  label { display: block; margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px; font: inherit;
          color: var(--fg); background: var(--bg); border: 1px solid var(--fg); border-radius: 0; }
  button { padding: 10px 24px; font: inherit; color: var(--bg); background: var(--fg); border: 0; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #status { margin: 24px 0 0; color: var(--muted); }
  #post { white-space: pre-wrap; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); }
  #post:empty { display: none; }
  img { display: block; width: 100%; margin-top: 12px; border: 1px solid var(--line); }
  a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Build in public, day {{DAY}}</h1>
  <form id="form">
    <label>Replies you wrote today<input id="replies" type="number" min="0" step="1" required></label>
    <label>Views today<input id="views" type="number" min="0" step="1" required></label>
    <button id="go">Submit</button>
  </form>
  <p id="status"></p>
  <div id="post"></div>
  <div id="images"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let shown = '';

  async function refresh() {
    let st;
    try { st = await (await fetch('/status')).json(); } catch { $('status').textContent = 'The runner is not answering.'; return; }
    const busy = ['working', 'queued', 'posted'].includes(st.status);
    for (const id of ['replies', 'views', 'go']) $(id).disabled = busy;
    if (st.status === 'posted') {
      $('status').innerHTML = st.url ? `Posted: <a href="${st.url}" target="_blank">${st.url}</a>` : 'Posted.';
    } else if (st.status === 'error') {
      $('status').textContent = `Not posted: ${st.error}. Press Submit to try again.`;
    } else {
      $('status').textContent = busy ? `${st.step || 'Working'}...` : '';
    }
    $('post').textContent = st.text || '';
    const imgs = (st.text && st.images) || [];
    if (imgs.join() !== shown) {
      shown = imgs.join();
      $('images').innerHTML = imgs.map((n) => `<img src="/image/${n}" alt="">`).join('');
    }
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('go').disabled = true;
    const res = await fetch('/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ replies: $('replies').value, views: $('views').value }) }).catch(() => null);
    if (!res || !res.ok) $('status').textContent = `Not sent: ${res ? (await res.json()).error : 'the runner is not answering'}.`;
    refresh();
  });

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
