<script>
coreStart();
uiStart();
function loop(now) {
  requestAnimationFrame(loop);
  if (!S.t0) S.t0 = now;
  const t0 = jsClock();
  coreFrame(now);
  uiFrame(now);
  frameCost(jsClock() - t0);
}
